name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm DisShot.spec

      - name: Generate SHA256 checksums
        run: |
          Get-FileHash -Algorithm SHA256 .\dist\DisShot.exe | ForEach-Object { "$($_.Hash)  DisShot.exe" } | Out-File -Encoding utf8 .\dist\SHA256SUMS.txt

      - name: Upload build artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: DisShot-Windows
          path: |
            dist/DisShot.exe
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/DisShot.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
